[project]
name = "apple-store-review-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "emoji>=2.16.0",
    "fastapi>=0.143.1",
    "google-auth[requests]>=2.62.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "hydra-core>=1.3.7",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "onnxruntime>=1.20",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
review-analyzer = "app.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
