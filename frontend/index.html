<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f4f6" />
    <title>Review Atlas · App review intelligence</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to report</a>
    <header class="header">
      <div class="app-switch" hidden>
        <button
          class="btn chip"
          id="app-chip"
          aria-expanded="false"
          aria-controls="analyze-form"
        >
          <span class="appico" id="app-icon" aria-hidden="true">A</span>
          <span class="chip-label" id="app-label"></span>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M4 6l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <button class="btn dark" id="export" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 2.5v8M4.8 7.6L8 10.8l3.2-3.2M3 13h10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Export JSON
      </button>
    </header>
    <main id="main">
      <section class="start" id="start">
        <h1>Analyze an app</h1>
        <form class="card start-form" id="analyze-form">
          <label class="field wide"
            >App Store ID or URL<input
              class="input"
              id="app-input"
              placeholder="389801252 or https://apps.apple.com/…"
              required
              autocomplete="off"
          /></label>
          <label class="field country"
            >Country<select class="input" id="country-input" required>
              {% for country in countries %}
              <option value="{{ country }}"{% if country == 'us' %} selected{% endif %}>{{ country | upper }}</option>
              {% endfor %}
            </select></label
          >
          <label class="field amount"
            >Reviews<input
              class="input"
              id="count-input"
              type="number"
              value="100"
              min="1"
              max="{{ max_review_count }}"
              step="1"
              required
          /></label>
          <button class="btn dark submit" type="submit" id="analyze-button">
            Analyze reviews
          </button>
        </form>
      </section>
      <div class="notice" id="status" role="status"></div>
      <section id="report" hidden></section>
    </main>
  </body>
</html>
