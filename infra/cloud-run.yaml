apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app-store-review-analyzer
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: review-analyzer@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/review-analyzer/app:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
          env:
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: appstore-review-analyzer
            - name: OTEL_EXPORTER
              value: google
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: LOG_LEVEL
              value: INFO
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: SENTIMENT_MODEL_PATH
              value: /app/models/sentiment
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: SENTIMENT_THREADS
              value: "1"
            - name: ANALYSIS_TIMEOUT_SECONDS
              value: "280"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
